<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="MBTI 人格測驗 - 找到專屬於你的 16 型人格，探索內心、理解他人">
<title>MBTI 人格測驗 ✦ 未來之星</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --primary:#FF6B9D;
  --secondary:#9B59F5;
  --accent:#FFD93D;
  --teal:#4ECDC4;
  --bg:#FFF9F5;
  --card:#FFFFFF;
  --text:#1A1A2E;
  --muted:#6E6E85;
  --shadow:0 10px 30px rgba(155,89,245,0.12);
  --shadow-lg:0 20px 50px rgba(255,107,157,0.18);
  --radius:20px;
  --radius-sm:14px;
  --radius-lg:28px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  font-family:'Nunito','Noto Sans TC',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.7;
  overflow-x:hidden;
  min-height:100vh;
}
button{font-family:inherit;cursor:pointer;border:none;outline:none;}
a{text-decoration:none;color:inherit;}
img{max-width:100%;display:block;}
.container{max-width:1200px;margin:0 auto;padding:0 24px;}

/* ============ NAV ============ */
.nav{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(255,249,245,0.85);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(155,89,245,0.08);
}
.nav-inner{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px 24px;
  max-width:1200px;
  margin:0 auto;
}
.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:900;
  font-size:22px;
  cursor:pointer;
  user-select:none;
}
.logo-icon{
  width:38px;
  height:38px;
  border-radius:12px;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  box-shadow:0 6px 16px rgba(155,89,245,0.3);
}
.logo-text{
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
}
.nav-links{
  display:flex;
  gap:6px;
  align-items:center;
}
.nav-link{
  padding:8px 14px;
  border-radius:12px;
  font-weight:700;
  font-size:15px;
  color:var(--text);
  transition:all .2s ease;
  cursor:pointer;
  background:transparent;
}
.nav-link:hover{background:rgba(155,89,245,0.08);color:var(--secondary);}
.nav-link.active{background:var(--secondary);color:#fff;}
.lang-toggle{
  padding:8px 16px;
  border-radius:12px;
  background:linear-gradient(135deg,var(--accent),var(--primary));
  color:#fff;
  font-weight:800;
  font-size:13px;
  margin-left:8px;
  transition:transform .2s ease;
}
.lang-toggle:hover{transform:translateY(-2px);}
.nav-toggle{
  display:none;
  padding:8px;
  border-radius:10px;
  background:transparent;
  font-size:22px;
}
@media(max-width:820px){
  .nav-links{
    position:absolute;
    top:100%;
    right:16px;
    flex-direction:column;
    background:var(--card);
    padding:16px;
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    min-width:200px;
    display:none;
  }
  .nav-links.open{display:flex;}
  .nav-toggle{display:block;}
  .nav-link{width:100%;text-align:left;}
}

/* ============ PAGES ============ */
.page{display:none;animation:fadeIn .5s ease;}
.page.active{display:block;}
@keyframes fadeIn{
  from{opacity:0;transform:translateY(12px);}
  to{opacity:1;transform:translateY(0);}
}
section{padding:80px 0;}
@media(max-width:640px){section{padding:50px 0;}}

.section-title{
  font-size:clamp(28px,4vw,44px);
  font-weight:900;
  text-align:center;
  margin-bottom:14px;
  line-height:1.2;
}
.section-sub{
  text-align:center;
  color:var(--muted);
  font-size:17px;
  margin-bottom:50px;
  max-width:620px;
  margin-left:auto;
  margin-right:auto;
}
.gradient-text{
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* ============ HERO ============ */
.hero{
  position:relative;
  min-height:calc(100vh - 72px);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:60px 24px;
  overflow:hidden;
}
.blob{
  position:absolute;
  border-radius:50%;
  filter:blur(60px);
  opacity:0.55;
  animation:blob 18s infinite ease-in-out;
  z-index:0;
}
.blob-1{
  width:420px;height:420px;
  background:var(--primary);
  top:-80px;left:-80px;
}
.blob-2{
  width:360px;height:360px;
  background:var(--secondary);
  top:40%;right:-60px;
  animation-delay:-6s;
}
.blob-3{
  width:320px;height:320px;
  background:var(--accent);
  bottom:-40px;left:30%;
  animation-delay:-12s;
}
.blob-4{
  width:280px;height:280px;
  background:var(--teal);
  top:20%;left:40%;
  animation-delay:-3s;
}
@keyframes blob{
  0%,100%{transform:translate(0,0) scale(1);}
  33%{transform:translate(40px,-30px) scale(1.1);}
  66%{transform:translate(-30px,30px) scale(0.92);}
}
.hero-inner{position:relative;z-index:2;max-width:820px;}
.hero-badge{
  display:inline-block;
  padding:8px 18px;
  border-radius:50px;
  background:rgba(255,255,255,0.7);
  backdrop-filter:blur(10px);
  font-weight:700;
  font-size:14px;
  color:var(--secondary);
  margin-bottom:24px;
  box-shadow:0 4px 12px rgba(155,89,245,0.1);
}
.hero-title{
  font-size:clamp(36px,6vw,68px);
  font-weight:900;
  line-height:1.1;
  margin-bottom:20px;
  letter-spacing:-1px;
}
.hero-sub{
  font-size:clamp(16px,2vw,20px);
  color:var(--muted);
  margin-bottom:36px;
  max-width:560px;
  margin-left:auto;
  margin-right:auto;
}
.cta-group{
  display:flex;
  gap:14px;
  justify-content:center;
  flex-wrap:wrap;
  margin-bottom:50px;
}
.btn{
  padding:14px 32px;
  border-radius:50px;
  font-weight:800;
  font-size:16px;
  transition:all .25s ease;
  display:inline-flex;
  align-items:center;
  gap:8px;
}
.btn-primary{
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  color:#fff;
  box-shadow:0 8px 24px rgba(255,107,157,0.35);
}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(255,107,157,0.45);}
.btn-secondary{
  background:var(--card);
  color:var(--text);
  box-shadow:var(--shadow);
}
.btn-secondary:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);}
.btn-accent{
  background:var(--accent);
  color:var(--text);
  box-shadow:0 8px 24px rgba(255,217,61,0.4);
}
.btn-accent:hover{transform:translateY(-3px);}
.btn-ghost{
  background:transparent;
  color:var(--secondary);
  border:2px solid var(--secondary);
}
.btn-ghost:hover{background:var(--secondary);color:#fff;}

.pill-grid{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
  max-width:760px;
  margin:0 auto;
}
.pill{
  padding:8px 16px;
  border-radius:50px;
  background:rgba(255,255,255,0.8);
  backdrop-filter:blur(8px);
  font-weight:700;
  font-size:13px;
  color:var(--text);
  cursor:pointer;
  transition:all .2s ease;
  border:2px solid transparent;
}
.pill:hover{
  transform:translateY(-3px) scale(1.05);
  border-color:var(--primary);
  box-shadow:0 6px 16px rgba(255,107,157,0.2);
}

/* ============ INTRO ============ */
.dim-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:24px;
  margin:40px 0 80px;
}
.dim-card{
  background:var(--card);
  border-radius:var(--radius);
  padding:30px 24px;
  box-shadow:var(--shadow);
  text-align:center;
  transition:transform .3s ease, box-shadow .3s ease;
}
.dim-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg);}
.dim-emoji{font-size:42px;margin-bottom:12px;}
.dim-title{font-weight:900;font-size:20px;margin-bottom:6px;}
.dim-sub{color:var(--muted);font-size:14px;margin-bottom:16px;}
.dim-pair{display:flex;gap:10px;justify-content:center;}
.dim-letter{
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  color:#fff;
  padding:6px 16px;
  border-radius:20px;
  font-weight:800;
  font-size:13px;
}
.dim-letter.alt{background:linear-gradient(135deg,var(--accent),var(--teal));color:var(--text);}
.types-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:18px;
}
.type-card{
  background:var(--card);
  border-radius:var(--radius);
  padding:24px 20px;
  box-shadow:var(--shadow);
  cursor:pointer;
  transition:transform .3s ease, box-shadow .3s ease;
  border-top:5px solid var(--primary);
}
.type-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg);}
.type-emoji{font-size:38px;margin-bottom:10px;}
.type-code{
  font-weight:900;
  font-size:22px;
  letter-spacing:2px;
  margin-bottom:4px;
}
.type-name{color:var(--muted);font-weight:700;font-size:14px;margin-bottom:12px;}
.type-desc{font-size:13px;color:var(--text);line-height:1.5;}

/* ============ QUIZ ============ */
.quiz-card{
  background:var(--card);
  border-radius:var(--radius-lg);
  padding:44px 40px;
  box-shadow:var(--shadow-lg);
  max-width:720px;
  margin:0 auto;
}
@media(max-width:640px){.quiz-card{padding:28px 22px;}}
.progress-wrap{margin-bottom:32px;}
.progress-header{
  display:flex;
  justify-content:space-between;
  font-weight:700;
  font-size:14px;
  color:var(--muted);
  margin-bottom:10px;
}
.progress-bar{
  height:8px;
  background:#F0EDF5;
  border-radius:50px;
  overflow:hidden;
}
.progress-fill{
  height:100%;
  background:linear-gradient(90deg,var(--primary),var(--secondary));
  border-radius:50px;
  transition:width .5s ease;
}
.quiz-q{
  font-weight:800;
  font-size:22px;
  margin-bottom:26px;
  line-height:1.5;
}
.opts-wrap{display:flex;flex-direction:column;gap:12px;margin-bottom:32px;}
.opt{
  padding:18px 22px;
  background:#FAF7FE;
  border-radius:var(--radius);
  cursor:pointer;
  transition:all .2s ease;
  border:2px solid transparent;
  text-align:left;
  font-weight:600;
  font-size:16px;
  color:var(--text);
  width:100%;
  font-family:inherit;
  line-height:1.5;
}
.opt:hover{background:#F3EEFB;transform:translateX(4px);}
.opt.selected{
  background:linear-gradient(135deg,rgba(255,107,157,0.14),rgba(155,89,245,0.14));
  border-color:var(--secondary);
}
.quiz-actions{display:flex;justify-content:space-between;gap:12px;}
.quiz-actions .btn{padding:12px 28px;font-size:15px;}
.quiz-actions .btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;box-shadow:none;}

/* ============ RESULT ============ */
.result-wrap{max-width:820px;margin:0 auto;}
.result-hero{
  background:var(--card);
  border-radius:var(--radius-lg);
  padding:50px 40px;
  text-align:center;
  box-shadow:var(--shadow-lg);
  margin-bottom:24px;
  position:relative;
  overflow:hidden;
}
.result-hero::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;height:6px;
  background:linear-gradient(90deg,var(--primary),var(--accent),var(--secondary),var(--teal));
}
.result-emoji{font-size:80px;margin-bottom:10px;}
.result-code{
  font-weight:900;
  font-size:56px;
  letter-spacing:4px;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  margin-bottom:10px;
}
.result-name{font-weight:800;font-size:24px;margin-bottom:6px;}
.result-name-en{color:var(--muted);font-size:15px;margin-bottom:22px;}
.traits-wrap{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:16px;}
.trait-pill{
  padding:6px 14px;
  background:rgba(255,107,157,0.12);
  color:var(--primary);
  border-radius:50px;
  font-weight:700;
  font-size:13px;
}
.dim-bars{
  background:var(--card);
  border-radius:var(--radius);
  padding:30px;
  box-shadow:var(--shadow);
  margin-bottom:24px;
}
.dim-bars h3{font-weight:800;font-size:18px;margin-bottom:20px;text-align:center;}
.bar-row{margin-bottom:18px;}
.bar-row:last-child{margin-bottom:0;}
.bar-labels{
  display:flex;
  justify-content:space-between;
  font-weight:700;
  font-size:14px;
  margin-bottom:6px;
}
.bar-track{
  height:12px;
  background:#F0EDF5;
  border-radius:50px;
  overflow:hidden;
  display:flex;
}
.bar-left{
  background:linear-gradient(90deg,var(--primary),var(--secondary));
  transition:width .8s ease;
}
.bar-right{
  background:linear-gradient(90deg,var(--teal),var(--accent));
  transition:width .8s ease;
}
.ai-box{
  background:linear-gradient(135deg,rgba(255,107,157,0.08),rgba(155,89,245,0.08));
  border-radius:var(--radius);
  padding:28px;
  border:2px dashed rgba(155,89,245,0.3);
  margin-bottom:24px;
}
.ai-label{
  font-weight:800;
  font-size:12px;
  color:var(--secondary);
  margin-bottom:10px;
  letter-spacing:2px;
  text-transform:uppercase;
}
.ai-text{
  font-size:16px;
  line-height:1.9;
  color:var(--text);
  min-height:60px;
}
.result-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}

/* ============ COMPAT ============ */
.compat-controls{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  gap:20px;
  align-items:center;
  max-width:680px;
  margin:0 auto 40px;
}
@media(max-width:600px){.compat-controls{grid-template-columns:1fr;}}
.compat-sel{
  background:var(--card);
  border:2px solid transparent;
  border-radius:var(--radius);
  padding:16px 20px;
  font-size:16px;
  font-weight:700;
  box-shadow:var(--shadow);
  color:var(--text);
  font-family:inherit;
  cursor:pointer;
  transition:border-color .2s ease;
  width:100%;
}
.compat-sel:focus{outline:none;border-color:var(--secondary);}
.compat-heart{
  font-size:36px;
  text-align:center;
  animation:pulse 1.4s ease infinite;
}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.15);}}
.compat-result{
  background:var(--card);
  border-radius:var(--radius-lg);
  padding:40px;
  box-shadow:var(--shadow-lg);
  text-align:center;
  max-width:680px;
  margin:0 auto;
}
.ring-wrap{position:relative;width:180px;height:180px;margin:0 auto 24px;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:#F0EDF5;stroke-width:12;}
.ring-fg{fill:none;stroke:url(#ringGrad);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset 1s ease;}
.ring-text{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  font-weight:900;
  font-size:40px;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
}
.compat-level{
  display:inline-block;
  padding:8px 20px;
  border-radius:50px;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  color:#fff;
  font-weight:800;
  margin-bottom:16px;
}
.compat-desc{color:var(--text);font-size:15px;line-height:1.9;text-align:left;}

/* ============ STATS ============ */
.stats-total{
  text-align:center;
  font-size:17px;
  margin-bottom:40px;
  color:var(--muted);
}
.stats-total strong{
  color:var(--primary);
  font-size:34px;
  font-weight:900;
  margin:0 4px;
}
.chart-grid{
  display:grid;
  grid-template-columns:1.3fr 1fr;
  gap:24px;
}
@media(max-width:900px){.chart-grid{grid-template-columns:1fr;}}
.chart-card{
  background:var(--card);
  border-radius:var(--radius);
  padding:24px;
  box-shadow:var(--shadow);
}
.chart-card h3{font-weight:800;font-size:18px;margin-bottom:16px;text-align:center;}
.chart-box{position:relative;height:360px;}

/* ============ INSTRUCTOR ============ */
.instr-card{
  background:var(--card);
  border-radius:var(--radius-lg);
  padding:50px 40px;
  box-shadow:var(--shadow-lg);
  text-align:center;
  max-width:640px;
  margin:0 auto;
}
.instr-avatar{
  width:140px;
  height:140px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  color:#fff;
  font-size:60px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 24px;
  box-shadow:0 12px 30px rgba(155,89,245,0.35);
}
.instr-name{font-weight:900;font-size:28px;margin-bottom:6px;}
.instr-title{color:var(--secondary);font-weight:700;margin-bottom:24px;font-size:15px;}
.instr-bio{
  color:var(--muted);
  font-size:15px;
  line-height:1.9;
  margin-bottom:24px;
  padding:20px;
  background:#FAF7FE;
  border-radius:var(--radius);
}
.instr-tags{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.instr-tag{
  padding:6px 14px;
  background:rgba(78,205,196,0.18);
  color:#1F8C83;
  border-radius:50px;
  font-weight:700;
  font-size:13px;
}

/* ============ COURSE FORM ============ */
.course-form{
  background:var(--card);
  border-radius:var(--radius-lg);
  padding:40px;
  box-shadow:var(--shadow-lg);
  max-width:640px;
  margin:0 auto;
}
@media(max-width:640px){.course-form{padding:26px;}}
.form-field{margin-bottom:20px;}
.form-label{display:block;font-weight:700;font-size:14px;margin-bottom:8px;}
.form-label .req{color:var(--primary);}
.form-input, .form-select, .form-textarea{
  width:100%;
  padding:14px 18px;
  border:2px solid #EEE8F5;
  border-radius:var(--radius);
  font-size:15px;
  font-family:inherit;
  background:#FAF7FE;
  color:var(--text);
  transition:all .2s ease;
}
.form-input:focus, .form-select:focus, .form-textarea:focus{
  outline:none;
  border-color:var(--secondary);
  background:#fff;
}
.form-textarea{min-height:100px;resize:vertical;}
.form-submit{width:100%;margin-top:10px;}

/* ============ TOAST ============ */
.toast{
  position:fixed;
  bottom:40px;
  left:50%;
  transform:translateX(-50%) translateY(40px);
  background:var(--text);
  color:#fff;
  padding:14px 26px;
  border-radius:50px;
  font-weight:700;
  font-size:14px;
  box-shadow:0 10px 30px rgba(0,0,0,0.25);
  opacity:0;
  pointer-events:none;
  transition:all .3s ease;
  z-index:1000;
  max-width:90vw;
  text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ============ MODAL ============ */
.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(26,26,46,0.6);
  backdrop-filter:blur(6px);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:500;
  padding:20px;
}
.modal-backdrop.show{display:flex;animation:fadeIn .3s ease;}
.modal{
  background:var(--card);
  border-radius:var(--radius-lg);
  padding:40px 30px;
  max-width:380px;
  width:100%;
  text-align:center;
  position:relative;
  overflow:hidden;
}
.modal::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;height:6px;
  background:linear-gradient(90deg,var(--primary),var(--accent),var(--secondary),var(--teal));
}
.share-card{
  background:linear-gradient(135deg,rgba(255,107,157,0.06),rgba(155,89,245,0.06));
  border-radius:var(--radius);
  padding:24px 20px;
  margin-bottom:20px;
}
.share-emoji{font-size:64px;margin-bottom:8px;}
.share-code{
  font-weight:900;
  font-size:38px;
  letter-spacing:3px;
  margin-bottom:4px;
  color:var(--secondary);
}
.share-name{font-weight:700;margin-bottom:14px;font-size:16px;}
.share-desc{font-size:13px;color:var(--muted);margin-bottom:12px;line-height:1.6;}
.share-traits{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:12px;}
.share-traits .trait-pill{font-size:11px;padding:4px 10px;}
.share-watermark{
  font-size:11px;
  color:var(--muted);
  margin-top:10px;
  letter-spacing:2px;
}
.modal-actions{display:flex;gap:10px;justify-content:center;}

/* ============ LOADING SPINNER ============ */
.ld{
  display:inline-block;
  width:18px;
  height:18px;
  border:3px solid rgba(155,89,245,0.2);
  border-top-color:var(--secondary);
  border-radius:50%;
  animation:spin 0.8s linear infinite;
  vertical-align:middle;
  margin-right:8px;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* ============ FOOTER ============ */
.footer{
  padding:30px 24px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
  border-top:1px solid rgba(155,89,245,0.08);
  margin-top:40px;
}
.footer a{color:var(--secondary);font-weight:700;}

.ph-section{padding:100px 24px;text-align:center;color:var(--muted);font-size:18px;}
</style>
</head>
