<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="MBTI 人格測驗 - 找到專屬於你的 16 型人格，探索內心、理解他人">
<title>MBTI 人格測驗 ✦ 未來之星</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --primary:#FF6B9D;
  --secondary:#9B59F5;
  --accent:#FFD93D;
  --teal:#4ECDC4;
  --bg:#FFF9F5;
  --card:#FFFFFF;
  --text:#1A1A2E;
  --muted:#6E6E85;
  --shadow:0 10px 30px rgba(155,89,245,0.12);
  --shadow-lg:0 20px 50px rgba(255,107,157,0.18);
  --radius:20px;
  --radius-sm:14px;
  --radius-lg:28px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  font-family:'Nunito','Noto Sans TC',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.7;
  overflow-x:hidden;
  min-height:100vh;
}
button{font-family:inherit;cursor:pointer;border:none;outline:none;}
a{text-decoration:none;color:inherit;}
img{max-width:100%;display:block;}
.container{max-width:1200px;margin:0 auto;padding:0 24px;}

/* ============ NAV ============ */
.nav{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(255,249,245,0.85);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(155,89,245,0.08);
}
.nav-inner{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px 24px;
  max-width:1200px;
  margin:0 auto;
}
.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:900;
  font-size:22px;
  cursor:pointer;
  user-select:none;
}
.logo-icon{
  width:38px;
  height:38px;
  border-radius:12px;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  box-shadow:0 6px 16px rgba(155,89,245,0.3);
}
.logo-text{
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
}
.nav-links{
  display:flex;
  gap:6px;
  align-items:center;
}
.nav-link{
  padding:8px 14px;
  border-radius:12px;
  font-weight:700;
  font-size:15px;
  color:var(--text);
  transition:all .2s ease;
  cursor:pointer;
  background:transparent;
}
.nav-link:hover{background:rgba(155,89,245,0.08);color:var(--secondary);}
.nav-link.active{background:var(--secondary);color:#fff;}
.lang-toggle{
  padding:8px 16px;
  border-radius:12px;
  background:linear-gradient(135deg,var(--accent),var(--primary));
  color:#fff;
  font-weight:800;
  font-size:13px;
  margin-left:8px;
  transition:transform .2s ease;
}
.lang-toggle:hover{transform:translateY(-2px);}
.nav-toggle{
  display:none;
  padding:8px;
  border-radius:10px;
  background:transparent;
  font-size:22px;
}
@media(max-width:820px){
  .nav-links{
    position:absolute;
    top:100%;
    right:16px;
    flex-direction:column;
    background:var(--card);
    padding:16px;
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    min-width:200px;
    display:none;
  }
  .nav-links.open{display:flex;}
  .nav-toggle{display:block;}
  .nav-link{width:100%;text-align:left;}
}

/* ============ PAGES ============ */
.page{display:none;animation:fadeIn .5s ease;}
.page.active{display:block;}
@keyframes fadeIn{
  from{opacity:0;transform:translateY(12px);}
  to{opacity:1;transform:translateY(0);}
}
section{padding:80px 0;}
@media(max-width:640px){section{padding:50px 0;}}

.section-title{
  font-size:clamp(28px,4vw,44px);
  font-weight:900;
  text-align:center;
  margin-bottom:14px;
  line-height:1.2;
}
.section-sub{
  text-align:center;
  color:var(--muted);
  font-size:17px;
  margin-bottom:50px;
  max-width:620px;
  margin-left:auto;
  margin-right:auto;
}
.gradient-text{
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* ============ HERO ============ */
.hero{
  position:relative;
  min-height:calc(100vh - 72px);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:60px 24px;
  overflow:hidden;
}
.blob{
  position:absolute;
  border-radius:50%;
  filter:blur(60px);
  opacity:0.55;
  animation:blob 18s infinite ease-in-out;
  z-index:0;
}
.blob-1{
  width:420px;height:420px;
  background:var(--primary);
  top:-80px;left:-80px;
}
.blob-2{
  width:360px;height:360px;
  background:var(--secondary);
  top:40%;right:-60px;
  animation-delay:-6s;
}
.blob-3{
  width:320px;height:320px;
  background:var(--accent);
  bottom:-40px;left:30%;
  animation-delay:-12s;
}
.blob-4{
  width:280px;height:280px;
  background:var(--teal);
  top:20%;left:40%;
  animation-delay:-3s;
}
@keyframes blob{
  0%,100%{transform:translate(0,0) scale(1);}
  33%{transform:translate(40px,-30px) scale(1.1);}
  66%{transform:translate(-30px,30px) scale(0.92);}
}
.hero-inner{position:relative;z-index:2;max-width:820px;}
.hero-badge{
  display:inline-block;
  padding:8px 18px;
  border-radius:50px;
  background:rgba(255,255,255,0.7);
  backdrop-filter:blur(10px);
  font-weight:700;
  font-size:14px;
  color:var(--secondary);
  margin-bottom:24px;
  box-shadow:0 4px 12px rgba(155,89,245,0.1);
}
.hero-title{
  font-size:clamp(36px,6vw,68px);
  font-weight:900;
  line-height:1.1;
  margin-bottom:20px;
  letter-spacing:-1px;
}
.hero-sub{
  font-size:clamp(16px,2vw,20px);
  color:var(--muted);
  margin-bottom:36px;
  max-width:560px;
  margin-left:auto;
  margin-right:auto;
}
.cta-group{
  display:flex;
  gap:14px;
  justify-content:center;
  flex-wrap:wrap;
  margin-bottom:50px;
}
.btn{
  padding:14px 32px;
  border-radius:50px;
  font-weight:800;
  font-size:16px;
  transition:all .25s ease;
  display:inline-flex;
  align-items:center;
  gap:8px;
}
.btn-primary{
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  color:#fff;
  box-shadow:0 8px 24px rgba(255,107,157,0.35);
}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(255,107,157,0.45);}
.btn-secondary{
  background:var(--card);
  color:var(--text);
  box-shadow:var(--shadow);
}
.btn-secondary:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);}
.btn-accent{
  background:var(--accent);
  color:var(--text);
  box-shadow:0 8px 24px rgba(255,217,61,0.4);
}
.btn-accent:hover{transform:translateY(-3px);}
.btn-ghost{
  background:transparent;
  color:var(--secondary);
  border:2px solid var(--secondary);
}
.btn-ghost:hover{background:var(--secondary);color:#fff;}

.pill-grid{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
  max-width:760px;
  margin:0 auto;
}
.pill{
  padding:8px 16px;
  border-radius:50px;
  background:rgba(255,255,255,0.8);
  backdrop-filter:blur(8px);
  font-weight:700;
  font-size:13px;
  color:var(--text);
  cursor:pointer;
  transition:all .2s ease;
  border:2px solid transparent;
}
.pill:hover{
  transform:translateY(-3px) scale(1.05);
  border-color:var(--primary);
  box-shadow:0 6px 16px rgba(255,107,157,0.2);
}

/* ============ PLACEHOLDERS (will be filled later) ============ */
.ph-section{
  padding:100px 24px;
  text-align:center;
  color:var(--muted);
  font-size:18px;
}
</style>
</head>

      <div class="cta-group">
        <button class="btn btn-primary" data-page="quiz" data-i18n="hero.cta1">開始測驗 →</button>
        <button class="btn btn-secondary" data-page="intro" data-i18n="hero.cta2">認識 16 型</button>

    </div>
